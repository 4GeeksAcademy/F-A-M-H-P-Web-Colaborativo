<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito | Maison Elysee</title>
    <meta
      name="description"
      content="Vista completa de carrito para tienda online de moda francesa: productos, precios, cantidades y totalizacion con impuestos."
    />
    <meta name="keywords" content="carrito de compras, ecommerce, moda francesa" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Carrito | Maison Elysee" />
    <meta
      property="og:description"
      content="Seccion de carrito funcional con totalizacion completa para ecommerce de moda."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ShoppingCart",
        "name": "Carrito Maison Elysee",
        "description": "Carrito de compras con detalle de productos y totalizacion"
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Paris, France</p>
      <h1>Maison Elysee</h1>
    </header>

    <main>
      <section id="carrito" class="cart-page" aria-labelledby="cart-title">
        <header class="cart-header">
          <h2 id="cart-title">Tu carrito</h2>
          <p>Vista completa con detalle de productos y totalizacion</p>
        </header>

        <div class="cart-layout" aria-label="Contenido del carrito">
          <article class="cart-list" aria-label="Productos en carrito">
            <div class="cart-head-row" role="row">
              <span>Producto</span>
              <span>Precio unitario</span>
              <span>Cantidad</span>
              <span>Total</span>
            </div>

            <div id="cart-items"></div>
          </article>

          <aside class="cart-summary" aria-label="Totalizacion">
            <h3>Totalizacion</h3>

            <dl>
              <div>
                <dt>Subtotal</dt>
                <dd id="subtotal">$0.00</dd>
              </div>
              <div>
                <dt>Impuestos (20%)</dt>
                <dd id="taxes">$0.00</dd>
              </div>
              <div class="grand-total">
                <dt>Total</dt>
                <dd id="total">$0.00</dd>
              </div>
            </dl>

            <button type="button" class="buy-button">Comprar</button>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Maison Elysee - Modulo de carrito para prototipo ecommerce.</p>
    </footer>

    <script>
      const sampleProducts = [
        {
          name: "Blazer Ligne Paris",
          price: 219.0,
          quantity: 1,
          image:
            "https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=160&q=80"
        },
        {
          name: "Gabardina Saint-Honore",
          price: 289.0,
          quantity: 1,
          image:
            "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=160&q=80"
        },
        {
          name: "Camisa Marais Signature",
          price: 120.0,
          quantity: 2,
          image:
            "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=160&q=80"
        }
      ];

      const taxRate = 0.2;
      const currency = new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR"
      });

      const itemsContainer = document.getElementById("cart-items");
      const subtotalEl = document.getElementById("subtotal");
      const taxesEl = document.getElementById("taxes");
      const totalEl = document.getElementById("total");

      function renderCart(items) {
        itemsContainer.innerHTML = "";

        let subtotal = 0;

        items.forEach((item) => {
          const itemTotal = item.price * item.quantity;
          subtotal += itemTotal;

          const row = document.createElement("div");
          row.className = "cart-item-row";

          row.innerHTML = `
            <div class="product-cell">
              <img src="${item.image}" alt="${item.name}" class="product-thumb" loading="lazy" />
              <span>${item.name}</span>
            </div>
            <span>${currency.format(item.price)}</span>
            <span>${item.quantity}</span>
            <span>${currency.format(itemTotal)}</span>
          `;

          itemsContainer.appendChild(row);
        });

        const taxes = subtotal * taxRate;
        const total = subtotal + taxes;

        subtotalEl.textContent = currency.format(subtotal);
        taxesEl.textContent = currency.format(taxes);
        totalEl.textContent = currency.format(total);
      }

      renderCart(sampleProducts);
    </script>
  </body>
</html>
